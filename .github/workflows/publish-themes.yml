name: Publish bref-ui-themes

on:
  push:
    branches: [main]
    paths: [themes/package.json]

permissions:
  contents: read

concurrency:
  group: publish-bref-ui-themes
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      unpublished: ${{ steps.version.outputs.unpublished }}
      tag: ${{ steps.version.outputs.tag }}
      filename: ${{ steps.version.outputs.filename }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Detect version bump
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: node .github/scripts/changes.mjs
      - name: Check npm registry
        id: version
        if: steps.changes.outputs.themes == 'true'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version, private: isPrivate } = JSON.parse(readFileSync('themes/package.json', 'utf8'));
          assert.equal(name, 'bref-ui-themes');
          assert(!isPrivate);
          assert.match(version, /^\d+\.\d+\.\d+$/);
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`, {
            signal: AbortSignal.timeout(30000)
          });
          assert(response.ok || response.status === 404, `npm registry returned ${response.status}`);
          appendFileSync(process.env.GITHUB_OUTPUT,
            `unpublished=${!response.ok}\ntag=${name}@${version}\nfilename=${name}-${version}.tgz\n`);
          console.log(`${name}@${version}: ${response.ok ? 'already published' : 'ready to publish'}`);
          NODE

  publish:
    needs: version
    if: needs.version.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - run: bun run test:ci
      - run: bun run check
      - run: bun run lint
      - run: bun run build
      - name: Pack and inspect
        working-directory: themes
        env:
          PACKAGE_FILE: ${{ needs.version.outputs.filename }}
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP/$PACKAGE_FILE"
      - name: Publish
        working-directory: themes
        env:
          PACKAGE_FILE: ${{ needs.version.outputs.filename }}
        run: npm publish "$RUNNER_TEMP/$PACKAGE_FILE" --access public --provenance
      - name: Create package release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
