name: Publish bref-ui

on:
  push:
    branches: [main]
    paths: [core/package.json]

permissions:
  contents: read

concurrency:
  group: publish-bref-ui
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run build
      - name: Pack and inspect
        working-directory: core
        run: |
          PACKAGE_VERSION=$(npm pkg get version --workspaces=false | tr -d '"')
          PACKAGE_FILE="bref-ui-$PACKAGE_VERSION.tgz"
          echo "PACKAGE_FILE=$PACKAGE_FILE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=bref-ui@$PACKAGE_VERSION" >> "$GITHUB_ENV"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP/$PACKAGE_FILE"
      - name: Publish
        working-directory: core
        run: npm publish "$RUNNER_TEMP/$PACKAGE_FILE" --access public --provenance
      - name: Create package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
